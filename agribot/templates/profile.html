{% extends "base.html" %}
{% block title %}My Profile – AgriBot{% endblock %}
{% block page_title %}<i class="bi bi-person-fill me-1"></i> Farmer Profile{% endblock %}

{% block content %}
<div class="row g-3 justify-content-center">
  <div class="col-md-8">
    <div class="card agri-card">
      <div class="card-header fw-semibold">
        <i class="bi bi-person-circle me-1 text-success"></i>Personal & Farm Details
      </div>
      <div class="card-body">
        <div id="profileSaveAlert" class="alert alert-success d-none">Profile saved successfully!</div>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Full Name</label>
            <input type="text" id="pName" class="form-control" placeholder="Ramesh Kumar"/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Village</label>
            <input type="text" id="pVillage" class="form-control" placeholder="Anandpur"/>
          </div>
          <div class="col-md-6">
            <label class="form-label">District</label>
            <input type="text" id="pDistrict" class="form-control" placeholder="Nashik"/>
          </div>
          <div class="col-md-6">
            <label class="form-label">State</label>
            <select id="pState" class="form-select">
              <option value="">-- Select State --</option>
              <option>Andhra Pradesh</option><option>Bihar</option><option>Gujarat</option>
              <option>Haryana</option><option>Karnataka</option><option>Kerala</option>
              <option>Madhya Pradesh</option><option>Maharashtra</option><option>Odisha</option>
              <option>Punjab</option><option>Rajasthan</option><option>Tamil Nadu</option>
              <option>Telangana</option><option>Uttar Pradesh</option><option>West Bengal</option>
              <option>Other</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Farm Size (acres)</label>
            <input type="number" id="pFarmSize" class="form-control" placeholder="5.0" step="0.5"/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Soil Type</label>
            <select id="pSoilType" class="form-select">
              <option value="">-- Select --</option>
              <option>Alluvial</option><option>Black Cotton</option><option>Red Laterite</option>
              <option>Sandy</option><option>Clayey</option><option>Loamy</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Main Crop</label>
            <input type="text" id="pMainCrop" class="form-control" placeholder="Wheat, Rice, Cotton…"/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Irrigation Type</label>
            <select id="pIrrigation" class="form-select">
              <option value="">-- Select --</option>
              <option>Drip Irrigation</option><option>Sprinkler</option>
              <option>Flood/Furrow</option><option>Canal</option><option>Borewell</option><option>Rainfed</option>
            </select>
          </div>
          <div class="col-12 pt-2">
            <button class="btn btn-success px-4" id="saveProfileBtn">
              <i class="bi bi-floppy2-fill me-1"></i>Save Profile
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/profile.js') }}"></script>
{% endblock %}
