{% extends "base.html" %}
{% block title %}Weather – AgriBot{% endblock %}
{% block page_title %}<i class="bi bi-cloud-sun-fill me-1"></i> Weather Dashboard{% endblock %}

{% block content %}
<!-- Location Bar -->
<div class="card agri-card mb-3">
  <div class="card-body py-2">
    <div class="row g-2 align-items-center">
      <div class="col-auto"><i class="bi bi-geo-alt-fill text-danger"></i></div>
      <div class="col-md-3">
        <input type="number" id="latInput" class="form-control form-control-sm" placeholder="Latitude" value="20.5937" step="0.0001"/>
      </div>
      <div class="col-md-3">
        <input type="number" id="lonInput" class="form-control form-control-sm" placeholder="Longitude" value="78.9629" step="0.0001"/>
      </div>
      <div class="col-auto">
        <button class="btn btn-sm btn-success" id="fetchWeatherBtn">
          <i class="bi bi-arrow-repeat me-1"></i>Refresh
        </button>
        <button class="btn btn-sm btn-outline-secondary ms-1" id="geoLocBtn" title="Use my location">
          <i class="bi bi-crosshair"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="row g-3 mb-3" id="currentWeatherCards">
  <div class="col-6 col-md-3"><div class="stat-card stat-card-orange"><div class="stat-icon"><i class="bi bi-thermometer-half"></i></div><div class="stat-label">Temperature</div><div class="stat-value" id="wTemp">--</div></div></div>
  <div class="col-6 col-md-3"><div class="stat-card stat-card-blue"><div class="stat-icon"><i class="bi bi-droplet-fill"></i></div><div class="stat-label">Humidity</div><div class="stat-value" id="wHum">--</div></div></div>
  <div class="col-6 col-md-3"><div class="stat-card stat-card-green"><div class="stat-icon"><i class="bi bi-wind"></i></div><div class="stat-label">Wind</div><div class="stat-value" id="wWind">--</div></div></div>
  <div class="col-6 col-md-3"><div class="stat-card stat-card-teal"><div class="stat-icon"><i class="bi bi-cloud-rain-fill"></i></div><div class="stat-label">Precipitation</div><div class="stat-value" id="wRain">--</div></div></div>
</div>

<div class="row g-3">
  <!-- 7-day Forecast -->
  <div class="col-md-8">
    <div class="card agri-card">
      <div class="card-header fw-semibold"><i class="bi bi-calendar3 me-1"></i>7-Day Forecast</div>
      <div class="card-body">
        <canvas id="weatherChart" height="130"></canvas>
      </div>
    </div>
  </div>

  <!-- Farming Advisory -->
  <div class="col-md-4">
    <div class="card agri-card h-100">
      <div class="card-header fw-semibold"><i class="bi bi-lightbulb-fill text-warning me-1"></i>Farming Advisory</div>
      <div class="card-body" id="weatherAdvisory">
        <div class="spinner-border spinner-border-sm text-success" role="status"></div>
      </div>
      <div class="card-footer">
        <button class="btn btn-sm btn-success w-100" id="askWeatherBtn">
          Ask: "Can I sow seeds tomorrow?"
        </button>
      </div>
    </div>
  </div>

  <!-- Forecast Cards Row -->
  <div class="col-12">
    <div class="card agri-card">
      <div class="card-header fw-semibold">Daily Forecast</div>
      <div class="card-body">
        <div class="row g-2" id="forecastCards"></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/weather.js') }}"></script>
{% endblock %}
